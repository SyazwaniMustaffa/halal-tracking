const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'RM '+(Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}),num=n=>Math.max(0,Number(n)||0),uid=()=>crypto.randomUUID(),today=()=>new Date().toLocaleDateString('en-CA');
const sections={wedding:{name:'💗 Kawin',color:'#c83c7a',soft:'#f4c4d9',defaults:['Other / Family Expenses','Tunang','Kawin','Tandang']},debt:{name:'❤️ Hutang',color:'#b42332',soft:'#f2bec2',defaults:['Monthly Commitments','PayLater','Personal Loan']},savings:{name:'💛 Simpanan',color:'#b88a16',soft:'#f6e2a0',defaults:['Wedding Savings','Emergency Fund','Travel','Personal Savings']}};

function msg(t){alert(t)}function fail(e){console.error(e);msg(e?.message||String(e))}function owns(c){return c.owner_id===user?.id}function canEdit(c){return owns(c)||shares.some(s=>s.category_id===c.id&&s.user_id===user.id&&s.permission==='edit')}
function nav(p){page=p;render()}function render(){if(!ready){$('main').innerHTML='<div class="card warning"><h2>Setup Supabase required</h2><p>App V4 perlu disambungkan kepada Supabase dahulu. Isi <code>config.js</code> dengan Project URL dan publishable/anon key, dan jalankan <code>schema.sql</code> dalam Supabase SQL Editor. Jangan guna service_role key.</p><p>Rujuk README dalam ZIP untuk langkah lengkap.</p></div>';return}if(!user){authUI();return}const links=[['dashboard','⌂ Dashboard'],['savings','💛 Simpanan'],['debt','❤️ Hutang'],['wedding','💗 Kawin'],['planner','🗓️ Planner'],['shared','🤝 Shared With Me']];$('main').innerHTML=`<div class="row between"><small>👤 ${esc(user.user_metadata?.full_name||user.email)} · <span id="syncState">☁️ Connected</span></small><button class="btn light" onclick="load()">↻ Sync</button><button class="btn light" onclick="signOut()">Log out</button></div><nav class="nav">${links.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="nav('${k}')">${n}</button>`).join('')}</nav><div id="view"></div>`;if(page==='dashboard')dashboard();else if(page==='planner')planner();else if(page==='shared')sharedView();else tracker()}
function authUI(){const sign=mode==='signup';$('main').innerHTML=`<div class="card auth"><h2>${sign?'Create Your Account ♡':'Welcome Back ♡'}</h2><div class="row"><button class="btn ${sign?'':'light'}" onclick="mode='signup';authUI()">Sign Up</button><button class="btn ${!sign?'':'light'}" onclick="mode='signin';authUI()">Sign In</button></div><form onsubmit="authSubmit(event)">${sign?'<label class="field">Full Name<input id="fullName" required autocomplete="name"></label>':''}<label class="field">Email<input id="email" type="email" required autocomplete="email"></label><label class="field">Password<input id="password" type="password" minlength="6" required autocomplete="${sign?'new-password':'current-password'}"></label><button class="btn" type="submit">${sign?'Create Account':'Sign In'}</button></form><p><button class="btn light" onclick="resetPassword()">Forgot Password?</button></p><p class="muted">Setiap akaun ada data private sendiri. Email verification mungkin diperlukan.</p></div>`}
async function authSubmit(e){e.preventDefault();const email=$('email').value.trim(),password=$('password').value;if(mode==='signup'){const name=$('fullName').value.trim();const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name:name}}});if(error)return fail(error);msg(data.session?'Account created!':'Account created. Check email to verify before signing in.')}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)fail(error)}}
async function resetPassword(){const email=prompt('Email untuk reset password:');if(!email)return;const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)fail(error);else msg('Check email untuk reset password. Pastikan redirect URL telah dibenarkan dalam Supabase Auth settings.')}
async function signOut(){await client.auth.signOut();user=null;categories=[];shares=[];todos=[];render()}
async function load(){if(!user)return;const [c,s,t]=await Promise.all([client.from('ht_categories').select('*').order('name'),client.from('ht_shares').select('*'),client.from('ht_todos').select('*').eq('owner_id',user.id).maybeSingle()]);if(c.error||s.error||t.error){fail(c.error||s.error||t.error);return}categories=c.data||[];shares=s.data||[];todos=t.data?.items||[];render()}
function mine(p){return categories.filter(c=>c.section===p&&owns(c))}function visible(p){return categories.filter(c=>c.section===p)}function current(p){const cs=visible(p);return cs.find(c=>c.id===selected[p])||cs.find(owns)||cs[0]||null}
async function starterCategories(){const entries=[];for(const [section,cfg] of Object.entries(sections))for(const name of cfg.defaults)if(!mine(section).some(c=>c.name===name))entries.push({owner_id:user.id,section,name,items:[]});if(!entries.length)return msg("Starter categories already exist.");const {error}=await client.from("ht_categories").insert(entries);if(error)fail(error);else load()}
async function addCategory(p){const name=prompt('Nama kategori baru:')?.trim();if(!name)return;if(mine(p).some(c=>c.name.toLowerCase()===name.toLowerCase()))return msg('Kategori dah ada.');const {error}=await client.from('ht_categories').insert({owner_id:user.id,section:p,name});if(error)return fail(error);await load();selected[p]=mine(p).find(c=>c.name===name)?.id;render()}
async function renameCategory(c){if(!owns(c))return;const name=prompt('Rename category:',c.name)?.trim();if(!name||name===c.name)return;const {error}=await client.from('ht_categories').update({name}).eq('id',c.id);if(error)fail(error);else load()}
async function deleteCategory(c){if(!owns(c)||!confirm(`Delete "${c.name}" dan semua item + access sharing?`))return;const {error}=await client.from('ht_categories').delete().eq('id',c.id);if(error)fail(error);else{selected[c.section]=null;load()}}
async function saveCategory(c,changes){if(!canEdit(c))return;const {data:updated,error}=await client.from('ht_categories').update(changes).eq('id',c.id).select().single();if(error)return fail(error);categories=categories.map(x=>x.id===c.id?updated:x);const sync=$('syncState');if(sync)sync.textContent='☁️ Saved'}
function queueSave(c){clearTimeout(debounceTimers[c.id]);const sync=$('syncState');if(sync)sync.textContent='⏳ Saving…';debounceTimers[c.id]=setTimeout(async()=>{await saveCategory(c,{items:c.items});delete debounceTimers[c.id]},650)}
function rowEdit(cid,id,key,val){const c=categories.find(x=>x.id===cid);if(!c||!canEdit(c))return;const r=c.items.find(r=>r.id===id);if(!r)return;r[key]=val;queueSave(c);const b=$('balance-'+id);if(b)b.textContent=money(Math.max(0,num(r.actual??r.target)-num(r.paid??r.saved)));const stat=$('status-'+id);if(stat)stat.textContent=status(c.section,r)[0];const s=$('sumPaid');if(s)s.textContent=money(total(c.items,c.section==='savings'?'saved':'paid'));if(c.section==='wedding')updateWeddingSummary(c);else updateSummary(c)}
function total(items,k){return (items||[]).reduce((a,r)=>a+num(r[k]),0)}function status(p,r){const a=num(p==='savings'?r.target:r.actual),b=num(p==='savings'?r.saved:r.paid);if(p==='savings')return a>0&&b>=a?['Achieved','good']:r.due&&r.due<today()?['Past Target Date','bad']:b>0?['In Progress','mid']:['Not Started',''];return b>a?['Overpaid','bad']:a>0&&b>=a?['Paid','good']:r.due&&r.due<today()?['Overdue','bad']:b>0?['Partial','mid']:['Unpaid','']}
function statBox(label,val,id){return `<div class="stat"><small>${label}</small><strong id="${id}">${money(val)}</strong></div>`}
function tracker(){const p=page,theme=sections[p],cs=visible(p),c=current(p);if(c)selected[p]=c.id;let h=`<section class="card" style="background:${theme.soft}"><h2>${theme.name} Tracker</h2><p>Editable table · category-level sharing · cloud sync</p></section><div class="row between"><b>Categories</b><button class="btn" onclick="addCategory('${p}')">+ Add Category</button></div><div class="cats" style="--accent:${theme.color}">${cs.map(x=>`<button class="cat ${x.id===c?.id?'active':''}" onclick="selected['${p}']='${x.id}';render()">${esc(x.name)} <small>${owns(x)?'🔒 Mine':'🤝 Shared'} · ${(x.items||[]).length} items</small></button>`).join('')}</div>`;if(!c){$('view').innerHTML=h+'<div class="card">Belum ada kategori. Tekan Add Category untuk mula.</div>';return}const items=c.items||[],isSav=p==='savings',paid=total(items,isSav?'saved':'paid'),actual=total(items,isSav?'target':'actual'),remaining=Math.max(0,(p==='wedding'?num(c.budget):actual)-paid),exceed=p==='wedding'&&paid>num(c.budget),ratio=p==='wedding'?(num(c.budget)?Math.min(1,paid/num(c.budget)):(paid>0?1:0)):0;const tint=Math.round(255-(255-180)*ratio),green=Math.round(255-(255-25)*ratio),blue=Math.round(255-(255-48)*ratio);h+=`<div class="row between"><h2>${esc(c.name)}</h2><div class="row">${owns(c)?`<button class="btn light" onclick="renameCategory(getCat('${c.id}'))">Rename</button><button class="btn light" onclick="shareUI('${c.id}')">🤝 Share</button><button class="btn danger" onclick="deleteCategory(getCat('${c.id}'))">Delete</button>`:`<span class="pill">${canEdit(c)?'Can Edit':'View Only'}</span>`}</div></div><div class="stats">${p==='wedding'?`<div class="stat"><small>Total Budget · RM</small><input aria-label="Total Budget" type="number" min="0" value="${num(c.budget)}" ${owns(c)?`onchange="setBudget('${c.id}',this.value)"`:'disabled'}></div>`:statBox(isSav?'Total Target':'Total Due',actual,'sumActual')}${statBox(isSav?'Total Saved':'Total Paid',paid,'sumPaid')}<div id="usageBox" class="stat ${p==='wedding'?'usage':''}" ${p==='wedding'?`style="background:rgb(${tint},${green},${blue});color:${ratio>.62?'white':'#67233f'}"`:''}><small id="usageLabel">${p==='wedding'?(exceed?'Exceed':'Balance'):isSav?'Remaining':'Balance'}</small><strong id="usageValue">${money(exceed?paid-num(c.budget):remaining)}</strong></div></div><div class="row between"><h3>Listing</h3><button class="btn" ${canEdit(c)?`onclick="addItem('${c.id}')"`:'disabled'}>+ Add Row</button></div><div class="tablewrap" style="--soft:${theme.soft}"><table class="tracker"><thead><tr>${['No.','Item',isSav?'Target (RM)':'Actual (RM)',isSav?'Saved (RM)':'Paid (RM)','Balance',isSav?'Target Date':'Due Date','Status'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${items.map((r,i)=>rowHTML(c,r,i)).join('')}</tbody></table></div><p class="muted">Swipe table kiri/kanan pada phone. Notes, gambar, dokumen dan link di bawah setiap item.</p>`;$('view').innerHTML=h}
function getCat(id){return categories.find(c=>c.id===id)}function rowHTML(c,r,i){const p=c.section,a=p==='savings'?'target':'actual',b=p==='savings'?'saved':'paid',can=canEdit(c),disabled=can?'':'disabled',handler=k=>`oninput="rowEdit('${c.id}','${r.id}','${k}',this.value)"`,[s,cl]=status(p,r);return `<tr><td>${i+1}</td><td><input ${disabled} value="${esc(r.name)}" ${handler('name')}></td><td><input type="number" min="0" ${disabled} value="${num(r[a])}" ${handler(a)}></td><td><input type="number" min="0" ${disabled} value="${num(r[b])}" ${handler(b)}></td><td id="balance-${r.id}">${money(Math.max(0,num(r[a])-num(r[b])))}</td><td><input type="date" ${disabled} value="${esc(r.due||'')}" ${handler('due')}></td><td><span id="status-${r.id}" class="pill ${cl}">${s}</span></td></tr><tr class="note"><td colspan="7"><label>📝 NOTES — ${esc(r.name)} </label><textarea ${disabled} placeholder="Warna, kedai, kuantiti, details..." ${handler('notes')}>${esc(r.notes||'')}</textarea><div class="row">${(r.links||[]).map((link,j)=>`<span class="pill"><a href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(link.name)}</a> ${can?`<button class="btn danger" onclick="removeLink('${c.id}','${r.id}',${j})">×</button>`:''}</span>`).join('')}${(r.files||[]).map((f,j)=>`<button class="btn light" onclick="openCloudFile('${c.id}','${esc(f.path)}')">${f.kind==='image'?'🖼️':'📄'} ${esc(f.name)}</button>${can?`<button class="btn danger" onclick="deleteCloudFile('${c.id}','${r.id}',${j})">×</button>`:''}`).join('')}${can?`<button class="btn light" onclick="uploadCloudFile('${c.id}','${r.id}','image')">🖼️ Picture</button><button class="btn light" onclick="uploadCloudFile('${c.id}','${r.id}','document')">📄 Document</button><button class="btn light" onclick="addLink('${c.id}','${r.id}')">🔗 Link</button><button class="btn danger" onclick="deleteItem('${c.id}','${r.id}')">Delete</button>`:''}</div></td></tr>`}
async function setBudget(id,v){const c=getCat(id);if(!owns(c))return;c.budget=num(v);await saveCategory(c,{budget:c.budget});updateWeddingSummary(c)}function updateWeddingSummary(c){const paid=total(c.items,'paid'),budget=num(c.budget),over=paid>budget,ratio=budget?Math.min(1,paid/budget):(paid?1:0),r=Math.round(255-79*ratio),g=Math.round(255-230*ratio),b=Math.round(255-207*ratio),box=$('usageBox');if(!box)return;box.style.background=`rgb(${r},${g},${b})`;box.style.color=ratio>.62?'white':'#67233f';$('usageLabel').textContent=over?'Exceed':'Balance';$('usageValue').textContent=money(over?paid-budget:budget-paid)}function updateSummary(c){const sav=c.section==='savings',a=total(c.items,sav?'target':'actual'),b=total(c.items,sav?'saved':'paid');if($('sumActual'))$('sumActual').textContent=money(a);if($('usageValue'))$('usageValue').textContent=money(Math.max(0,a-b))}
async function addItem(cid){const c=getCat(cid);if(!canEdit(c))return;c.items=[...(c.items||[]),{id:uid(),name:'',actual:0,paid:0,target:0,saved:0,due:'',notes:'',links:[]}];await saveCategory(c,{items:c.items});render()}async function deleteItem(cid,id){const c=getCat(cid);if(!canEdit(c)||!confirm('Delete item ini?'))return;c.items=c.items.filter(r=>r.id!==id);await saveCategory(c,{items:c.items});render()}

async function uploadCloudFile(cid,id,kind){const c=getCat(cid),r=c?.items.find(x=>x.id===id);if(!c||!r||!canEdit(c))return;const picker=document.createElement('input');picker.type='file';picker.accept=kind==='image'?'image/*':'.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip,.odt,.ods,.rtf';picker.onchange=async()=>{const f=picker.files?.[0];if(!f)return;if(f.size>20*1024*1024)return msg('Maximum 20 MB per file.');const safeName=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-90),path=`${cid}/${uid()}-${safeName}`;const {error}=await client.storage.from('ht-attachments').upload(path,f,{upsert:false});if(error)return fail(error);r.files??=[];r.files.push({name:f.name,path,kind});await saveCategory(c,{items:c.items});render()};picker.click()}
async function openCloudFile(cid,path){if(!path.startsWith(cid+'/'))return;const {data,error}=await client.storage.from('ht-attachments').createSignedUrl(path,60);if(error)return fail(error);window.open(data.signedUrl,'_blank','noopener,noreferrer')}
async function deleteCloudFile(cid,id,index){const c=getCat(cid),r=c?.items.find(x=>x.id===id);if(!c||!r||!canEdit(c)||!confirm('Remove attachment?'))return;const f=r.files[index];if(!f)return;const {error}=await client.storage.from('ht-attachments').remove([f.path]);if(error)return fail(error);r.files.splice(index,1);await saveCategory(c,{items:c.items});render()}

async function addLink(cid,id){const c=getCat(cid),r=c.items.find(r=>r.id===id);if(!canEdit(c)||!r)return;let url=prompt('Paste link (https://...)');if(!url)return;try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw Error();url=u.href}catch{return msg('Link tidak sah')}const name=prompt('Nama link:')||'Link';r.links??=[];r.links.push({name,url});await saveCategory(c,{items:c.items});render()}
async function removeLink(cid,id,i){const c=getCat(cid),r=c.items.find(r=>r.id===id);if(!canEdit(c)||!r)return;r.links.splice(i,1);await saveCategory(c,{items:c.items});render()}
async function shareUI(cid){const c=getCat(cid);if(!owns(c))return;const {data,error}=await client.from('ht_shares').select('*').eq('category_id',cid);if(error)return fail(error);const email=prompt(`Share "${c.name}" sahaja.\nMasukkan email pengguna yang DAH daftar:`);if(!email)return;const level=prompt('Permission: taip view atau edit','view')?.toLowerCase();if(!['view','edit'].includes(level))return msg('Pilih view atau edit.');const {error:err}=await client.rpc('ht_invite',{cat:cid,recipient_email:email.trim(),access_level:level});if(err)return fail(err);msg('Access diberikan untuk kategori ini sahaja. Pengguna boleh buka Shared With Me.');await load()}
async function revoke(cid,userId){if(!confirm('Revoke access?'))return;const {error}=await client.from('ht_shares').delete().eq('category_id',cid).eq('user_id',userId);if(error)fail(error);else load()}
function sharedView(){const owned=categories.filter(owns),incoming=categories.filter(c=>!owns(c));$('view').innerHTML=`<div class="card"><h2>🤝 Shared With Me</h2><p>Hanya kategori yang orang share dengan kau akan muncul di sini.</p>${incoming.map(c=>`<div class="access row between"><span><b>${esc(c.name)}</b> · ${sections[c.section].name}<br><small>${canEdit(c)?'✏️ Can Edit':'👀 View Only'}</small></span><button class="btn" onclick="selected['${c.section}']='${c.id}';nav('${c.section}')">Open</button></div>`).join('')||'<p class="muted">Belum ada shared categories.</p>'}</div><div class="card"><h3>My Shared Categories</h3>${owned.filter(c=>shares.some(s=>s.category_id===c.id)).map(c=>`<div class="access"><b>${esc(c.name)}</b>${shares.filter(s=>s.category_id===c.id).map(s=>`<div class="row between"><small>User ID: ${esc(s.user_id.slice(0,8))}… · ${esc(s.permission)}</small><button class="btn danger" onclick="revoke('${c.id}','${s.user_id}')">Revoke</button></div>`).join('')}</div>`).join('')||'<p class="muted">Belum share mana-mana kategori.</p>'}</div>`}
function dashboard(){const all=categories.filter(owns),s=all.filter(c=>c.section==='savings').flatMap(c=>c.items),d=all.filter(c=>c.section==='debt').flatMap(c=>c.items),w=all.filter(c=>c.section==='wedding').flatMap(c=>c.items);$('view').innerHTML=`<div class="card" style="background:#f4dfe8"><h2>Welcome back ♡</h2><p>Ringkasan akaun peribadi kau. Kategori orang lain tidak dicampur dalam dashboard.</p></div><div class="stats">${statBox('💛 Total Saved',total(s,'saved'),'dash1')}${statBox('❤️ Hutang Balance',d.reduce((a,r)=>a+Math.max(0,num(r.actual)-num(r.paid)),0),'dash2')}${statBox('💗 Wedding Paid',total(w,'paid'),'dash3')}</div><div class="card"><h3>Upcoming Dates</h3>${events().filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8).map(e=>`<div class="todo"><span>${esc(e.title)}</span><small>${esc(e.date)}</small></div>`).join('')||'<p class="muted">No upcoming dates.</p>'}</div><div class="card"><h3>Get Started</h3><button class="btn light" onclick="starterCategories()">+ Create Starter Categories</button><p class="muted">Tunang, Kawin, Tandang, Monthly Commitments, Wedding Savings dan lain-lain. Kalau nak import backup V3, buat import dahulu.</p></div><div class="card"><h3>Import V3 Backup</h3><p class="muted">Import backup JSON sekali sahaja selepas daftar akaun. Fail gambar/dokumen asal tidak termasuk dalam migrasi.</p><input type="file" id="backupFile" accept=".json,application/json"> <button class="btn" onclick="migrateV3()">Import Backup</button></div><div class="card warning"><b>Cloud Sync</b><p>Data disimpan ikut akaun Supabase. Perubahan perlu internet. Gambar dan dokumen baharu disimpan dalam cloud storage private. Fail lokal V3 tidak dipindahkan secara automatik.</p></div>`}
async function saveTodos(){const {error}=await client.from('ht_todos').upsert({owner_id:user.id,items:todos});if(error)fail(error)}async function addTodo(){const name=$('todoName').value.trim(),date=$('todoDate').value;if(!name)return; todos.push({id:uid(),name,date,done:false});await saveTodos();planner()}async function todoDone(id,v){const t=todos.find(x=>x.id===id);if(t)t.done=v;await saveTodos();planner()}async function todoDelete(id){todos=todos.filter(x=>x.id!==id);await saveTodos();planner()}
function events(){const out=[];for(const c of categories)for(const r of c.items||[])if(r.due)out.push({date:r.due,title:`${r.name||'Item'} · ${c.name}`,section:c.section,cat:c.id});for(const t of todos)if(t.date)out.push({date:t.date,title:`✓ ${t.name}`,section:'todo'});return out}
function planner(){const [y,m]=calMonth.split('-').map(Number),offset=(new Date(y,m-1,1).getDay()+6)%7,days=new Date(y,m,0).getDate(),ev=events().filter(e=>calFilter==='general'||e.section===calFilter);let calendar='<div class="calendar">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<b style="text-align:center;font-size:11px">${x}</b>`).join('');for(let i=0;i<offset;i++)calendar+='<div class="day"></div>';for(let d=1;d<=days;d++){const date=calMonth+'-'+String(d).padStart(2,'0');calendar+=`<div class="day"><b>${d}</b>${ev.filter(e=>e.date===date).map(e=>`<span class="event">${esc(e.title)}</span>`).join('')}</div>`}calendar+='</div>';$('view').innerHTML=`<div class="card"><h2>🗓️ Planner & Calendar</h2><div class="grid2"><div><h3>To Do List</h3><div class="row"><input id="todoName" placeholder="Apa nak buat?" style="flex:1;min-width:120px;padding:9px"><input id="todoDate" type="date" style="padding:9px"><button class="btn" onclick="addTodo()">+ Add</button></div>${todos.map(t=>`<div class="todo"><input type="checkbox" ${t.done?'checked':''} onchange="todoDone('${t.id}',this.checked)"><span class="${t.done?'done':''}">${esc(t.name)}</span><small>${esc(t.date||'')}</small><button class="btn danger" onclick="todoDelete('${t.id}')">×</button></div>`).join('')}</div><div><h3>Calendar</h3><div class="row"><button class="btn light" onclick="changeMonth(-1)">‹</button><b>${calMonth}</b><button class="btn light" onclick="changeMonth(1)">›</button><select onchange="calFilter=this.value;planner()">${[['general','General · All Pages'],['wedding','Kawin'],['debt','Hutang'],['savings','Simpanan'],['todo','To Do']].map(([v,n])=>`<option value="${v}" ${calFilter===v?'selected':''}>${n}</option>`).join('')}</select></div>${calendar}</div></div></div>`}
function changeMonth(n){const [y,m]=calMonth.split('-').map(Number),d=new Date(y,m-1+n,1);calMonth=d.toISOString().slice(0,7);planner()}
async function migrateV3(){if(!confirm('Import data V3 akan TAMBAH kategori daripada backup ke akaun cloud. Jangan import berulang kali. Teruskan?'))return;const f=$('backupFile').files[0];if(!f)return;try{const raw=JSON.parse(await f.text()),v=raw.data||raw,entries=[];for(const p of Object.keys(sections)){if(!v[p]?.cats||!v[p]?.rows)throw Error('Backup format invalid');for(const name of v[p].cats){if(mine(p).some(c=>c.name===name))continue;entries.push({owner_id:user.id,section:p,name,budget:num(v[p].budgets?.[name]),items:v[p].rows.filter(r=>r.cat===name).map(r=>({id:uid(),name:r.name||'',actual:num(r.actual),paid:num(r.paid),target:num(r.target),saved:num(r.saved),due:r.due||'',notes:r.notes||'',links:(r.attachments||[]).filter(a=>a.kind==='link').map(a=>({name:a.name,url:a.url}))}))})}}if(entries.length){const {error}=await client.from('ht_categories').insert(entries);if(error)throw error}if(Array.isArray(v.todos)){todos=v.todos.map(t=>({...t,id:uid()}));await saveTodos()}await load();msg('Import selesai. Gambar dan dokumen V3 TIDAK dipindahkan; simpan backup asal!')}catch(e){fail(e)}}
async function init(){if(!ready)return render();const {data}=await client.auth.getSession();user=data.session?.user||null;client.auth.onAuthStateChange((event,session)=>{const next=session?.user||null;if(next?.id!==user?.id){user=next;categories=[];shares=[];todos=[];if(user)setTimeout(load,0);else render()}});if(user)await load();else render()}
init();setInterval(()=>{if(user&&document.visibilityState==='visible'&&!Object.values(debounceTimers).some(Boolean)&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))load()},25000);if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
